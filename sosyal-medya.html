<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sosyal Medya | Osman Zengin</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200..800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #121212;
            --text-main: #1a1a1a;
            --text-sub: #666666;
            --bg-body: #ffffff;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Plus Jakarta Sans", sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        nav {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            padding: 12px 30px;
            border-radius: 100px;
            z-index: 1000;
            display: flex;
            gap: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        nav a {
            text-decoration: none;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        nav a:hover { color: #888; }

        .page-header {
            text-align: center;
            margin-top: 140px;
            margin-bottom: 60px;
            padding: 0 5%;
        }

        .page-header h1 {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.1;
            margin-bottom: 15px;
        }

        .page-header p { color: var(--text-sub); font-size: 18px; }

        .portfolio-icerik {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 5% 100px 5%;
        }

        .grid-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 60px;
        }

        /* DİĞER SAYFALARLA BÜTÜNLEŞEN KUTU YAPISI */
        .proje-kutu {
            position: relative;
            width: 100%;
            max-width: 900px;
            border-radius: 24px;
            background: #f9f9f9; /* Hafif gri arka plan */
            transition: var(--transition);
            
            /* İSTEDİĞİN BOŞLUKLAR BURADA: */
            padding: 40px; /* Üst, alt, sağ ve soldan resme nefes aldırır */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .proje-kutu img {
            max-width: 100%; /* Kutu paddinginden sonra kalan alana sığar */
            height: auto;
            border-radius: 12px; /* Resmin kendisine de hafif bir kavis verdik */
            box-shadow: 0 5px 15px rgba(0,0,0,0.03); /* Resim havada dursun */
            transition: var(--transition);
        }

        .proje-kutu:hover {
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            transform: translateY(-5px);
        }

        .proje-kutu:hover img {
            transform: scale(1.02);
        }

        /* MOBİL DÜZELTME */
        @media (max-width: 768px) {
            .page-header { margin-top: 100px; }
            .page-header h1 { font-size: 32px; }
            .grid-container { gap: 30px; }
            
            .proje-kutu {
                border-radius: 16px;
                padding: 20px; /* Mobilde ekran dar olduğu için boşluğu biraz azalttık */
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html#hizmetler"><i class="fa-solid fa-arrow-left"></i> Geri Dön</a>
    </nav>

    <div class="page-header">
        <h1>Sosyal Medya Tasarımları</h1>
        <p>Dijital dünyada etkileşimi artıran görsel konseptler.</p>
    </div>

    <section class="portfolio-icerik">
        <div class="grid-container grid-sosyal">
            <div class="proje-kutu"><img src="res/medya/27.png" alt="Medya 01"></div>
            <div class="proje-kutu"><img src="res/medya/28.png" alt="Medya 02"></div>
            <div class="proje-kutu"><img src="res/medya/29.png" alt="Medya 03"></div>
        </div>
    </section>

</body>

</html>
