<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diğer Tasarımlar | Osman Zengin</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200..800&display=swap" rel="stylesheet">

    <style>
        :root { --primary: #121212; --text-main: #1a1a1a; --text-sub: #666666; --bg-body: #ffffff; --card-shadow: 0 10px 30px rgba(0,0,0,0.05); --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Plus Jakarta Sans", sans-serif; background-color: var(--bg-body); color: var(--text-main); line-height: 1.6; }

        nav { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); padding: 12px 30px; border-radius: 100px; z-index: 1000; display: flex; gap: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border: 1px solid rgba(0,0,0,0.05); }
        nav a { text-decoration: none; color: var(--text-main); font-size: 14px; font-weight: 600; text-transform: uppercase; transition: var(--transition); display: flex; align-items: center; gap: 8px;}
        nav a:hover { color: #888; }

        .page-header { text-align: center; margin-top: 140px; margin-bottom: 60px; padding: 0 5%; }
        .page-header h1 { font-size: 48px; font-weight: 800; letter-spacing: -1px; line-height: 1.1; margin-bottom: 15px; }
        .page-header p { color: var(--text-sub); font-size: 18px; }

        .portfolio-icerik { max-width: 1300px; margin: 0 auto; padding: 0 5% 100px 5%; }
        .grid-container { display: grid; gap: 40px; } 

        .proje-kutu { position: relative; border-radius: 20px; overflow: hidden; background: #f9f9f9; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #ccc; transition: var(--transition); }
        .proje-kutu i { font-size: 50px; margin-bottom: 15px; color: #e0e0e0; transition: var(--transition); }
        .proje-kutu span { font-weight: 600; font-size: 16px; color: #aaa; transition: var(--transition); }
        .proje-kutu:hover { background: #f0f0f0; box-shadow: var(--card-shadow); transform: translateY(-5px); }
        .proje-kutu:hover i, .proje-kutu:hover span { color: #888; }

        /* STANDART RESİM (38.png'nin kullanacağı tam boyut) */
        .proje-kutu img { 
            position: absolute; 
            top: 0;
            bottom: 0;
            left: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            z-index: 1; 
            transition: var(--transition); 
        }

        /* 38.png HARİÇ DİĞER RESİMLERE BOŞLUK UYGULAMA */
        .proje-kutu img:not([src*="38.png"]) {
            left: 30px;
            width: calc(100% - 60px);
        }

        .proje-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); z-index: 2; display: flex; flex-direction: column; justify-content: flex-end; padding: 30px; opacity: 0; transition: var(--transition); color: white; }
        .proje-overlay h3 { font-size: 24px; font-weight: 700; }
        .proje-overlay p { font-size: 14px; opacity: 0.8; }
        .proje-kutu:hover .proje-overlay { opacity: 1; }
        .proje-kutu:hover img { transform: scale(1.05); }

        .grid-diger { grid-template-columns: repeat(2, 1fr); }
        .grid-diger .proje-kutu { aspect-ratio: 4 / 3; }

        /* MOBİL UYUMLULUK */
        @media (max-width: 768px) { 
            .grid-diger { grid-template-columns: 1fr; } 
            .page-header h1 { font-size: 36px; } 

            /* Mobilde boşlukları daralt (Yine 38.png hariç) */
            .proje-kutu img:not([src*="38.png"]) {
                left: 15px;
                width: calc(100% - 30px);
            }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html#hizmetler"><i class="fa-solid fa-arrow-left"></i> Geri Dön</a>
    </nav>

    <div class="page-header">
        <h1>Diğer Tasarımlar</h1>
        <p>Farklı konseptler ve yaratıcı çözümler.</p>
    </div>

    <section class="portfolio-icerik">
        <div class="grid-container grid-diger">
            <div class="proje-kutu"><img src="res/diger/33.png" alt=""></div>
            <div class="proje-kutu"><img src="res/diger/34.png" alt=""></div>
            <div class="proje-kutu"><img src="res/diger/38.png" alt=""></div>
            <div class="proje-kutu"><img src="res/diger/36.png" alt=""></div>
            <div class="proje-kutu"><img src="res/diger/37.png" alt=""></div>
        </div>
    </section>

</body>
</html>
